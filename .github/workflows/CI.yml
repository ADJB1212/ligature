name: CI

on:
  push:
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

env:
  RUSTUP_TERM_PROGRESS_WHEN: "never"
  RUST_BACKTRACE: "1"
  DO_NOT_TRACK: "1"
  TECTONIC_DEP_BACKEND: "pkg-config"
  CFLAGS: "-std=gnu17"
  CXXFLAGS: "-std=c++17"

permissions:
  contents: read

jobs:
  workspace:
    name: Workspace checks
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup show

      - name: Install bundled engine build dependencies
        run: |
          brew install pkgconf freetype graphite2 icu4c libpng
          echo "PKG_CONFIG_PATH=$(brew --prefix icu4c)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check all workspace targets
        run: cargo check --locked --workspace --all-targets

      - name: Check Clippy lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --locked --workspace

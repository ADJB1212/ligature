[package]
name = "ligature-pdf"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false
description = "PDF document loading, page metadata, and page rasterization"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFData", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGPDFDocument", "CGPDFPage", "CGDataProvider", "CGContext", "CGBitmapContext", "CGColorSpace", "CGImage", "CGAffineTransform"] }

[dev-dependencies]
tempfile = { version = "3", default-features = false, features = [] }

[lints]
workspace = true

[package]
name = "ligature-toolchain"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false
description = "Bundled TeX resource locations and compatibility metadata"

[dependencies]
hex = { version = "0.4", default-features = false, features = ["std"] }
dirs = {version = "7", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
sha2 = { version = "0.11", default-features = false, features = ["alloc", "oid"] }
tar = { version = "0.4", default-features = false }
tempfile = { version = "3", default-features = false, features = [] }
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[build-dependencies]
hex = { version = "0.4", default-features = false, features = ["std"] }
sha2 = { version = "0.11", default-features = false, features = ["alloc", "oid"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true

[package]
name = "Ligature"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
ligature-app.workspace = true

[lints]
workspace = true

[workspace]
members = [".", "crates/*", "tools/package-resources"]
default-members = ["."]
resolver = "3"

[workspace.package]
version = "0.0.1"
authors = ["Andrew Jaffe <adjaffeb@gmail.com>"]
repository = "https://github.com/ADJB1212/ligature"
license = "MIT"
rust-version = "1.99"
edition = "2024"

[workspace.dependencies]
memchr = { version = "2", default-features = false, features = ["std"] }
gpui = { package = "gpui-ce", version = "0.2", default-features = false }
gpui_platform = { package = "gpui_ce_platform", version = "0.1", default-features = false, features = ["font-kit"] }
ligature-core = { path = "crates/core" }
ligature-app = { path = "crates/app" }
ligature-workspace = { path = "crates/workspace" }
ligature-ui = { path = "crates/ui" }
ligature-theme = { path = "crates/theme" }
ligature-buffer = { path = "crates/buffer" }
ligature-editor = { path = "crates/editor" }
ligature-fs = { path = "crates/fs" }
ligature-project = { path = "crates/project" }
ligature-settings = { path = "crates/settings" }
ligature-syntax = { path = "crates/syntax" }
ligature-tex = { path = "crates/tex" }
ligature-bibliography = { path = "crates/bibliography" }
ligature-diagnostics = { path = "crates/diagnostics" }
ligature-completion = { path = "crates/completion" }
ligature-lsp = { path = "crates/lsp" }
ligature-toolchain = { path = "crates/toolchain" }
ligature-build = { path = "crates/build" }
ligature-pdf = { path = "crates/pdf" }
ligature-preview = { path = "crates/preview" }
ligature-synctex = { path = "crates/synctex" }
ligature-search = { path = "crates/search" }
ligature-formatter = { path = "crates/formatter" }

[profile.release]
opt-level = 3
debug = false
lto = "fat"
panic = "abort"
strip = true
codegen-units = 1

[profile.dev]
incremental = true
opt-level = 1
debug = "line-directives-only"
split-debuginfo = "unpacked"
lto = false

[profile.dev.package.ligature-toolchain]
opt-level = 3
codegen-units = 1
debug = false
incremental = false

[profile.test]
incremental = true
opt-level = 1
debug = "line-directives-only"
split-debuginfo = "unpacked"
lto = false

[profile.test.package.ligature-toolchain]
opt-level = 3
codegen-units = 1
debug = false
incremental = false

[workspace.lints.rust]
warnings = { level = "deny", priority = -1 }
unused_mut = "deny"
dead_code = "allow"

[workspace.lints.clippy]
needless_return = "allow"
perf = { level = "deny", priority = -1 }
redundant_clone = "deny"
unnecessary_to_owned = "deny"
needless_collect = "deny"
or_fun_call = "deny"
assigning_clones = "deny"
implicit_clone = "deny"
iter_overeager_cloned = "deny"
map_clone = "deny"
trivially_copy_pass_by_ref = "deny"
large_types_passed_by_value = "deny"
large_enum_variant = "deny"
large_stack_frames = "deny"
vec_init_then_push = "deny"
format_collect = "deny"
manual_memcpy = "deny"
clone_on_copy = "deny"
useless_conversion = "deny"
redundant_locals = "deny"
ptr_eq = "deny"
ptr_as_ptr = "deny"
ptr_cast_constness = "deny"
ref_as_ptr = "deny"
borrow_as_ptr = "deny"
unnecessary_unwrap = "deny"
clone_on_ref_ptr = "deny"
if_same_then_else = "deny"
